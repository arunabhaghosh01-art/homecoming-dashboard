<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homecoming Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#000;
color:#fff;
padding:20px;
}

.header{
text-align:center;
margin-top:20px;
margin-bottom:30px;
}

.header h1{
font-size:32px;
margin-bottom:10px;
}

.header p{
color:#aaa;
}

.card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:20px;
margin-bottom:20px;
}

.card h2{
margin-bottom:15px;
font-size:20px;
}

.countdown{
font-size:28px;
font-weight:bold;
color:#00ff88;
line-height:1.5;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.small-card{
background:#111;
border:1px solid #222;
border-radius:20px;
padding:20px;
text-align:center;
}

.small-card h3{
font-size:14px;
color:#999;
margin-bottom:10px;
}

.small-card p{
font-size:22px;
font-weight:bold;
}

.footer{
margin-top:30px;
text-align:center;
color:#666;
font-size:14px;
}
</style>
</head>

<body>

<div class="header">
<h1>🏠 Homecoming Dashboard</h1>
<p>Arunabha Ghosh</p>
</div>

<div class="card">
<h2>⏳ Countdown to Homecoming</h2>
<div class="countdown" id="countdown">
Loading...
</div>
</div>

<div class="grid">

<div class="small-card">
<h3>Target Date</h3>
<p>09 Oct 2026</p>
</div>

<div class="small-card">
<h3>Status</h3>
<p>🎯 Active</p>
</div>

<div class="small-card">
<h3>Destination</h3>
<p>Home</p>
</div>

<div class="small-card">
<h3>Mode</h3>
<p>🚆 Train</p>
</div>

</div>

<div class="footer">
Made by Arunabha Ghosh
</div>

<script>

const targetDate = new Date("2026-10-09T00:00:00").getTime();

function updateCountdown(){

const now = new Date().getTime();
const distance = targetDate - now;

if(distance < 0){
document.getElementById("countdown").innerHTML =
"🎉 Welcome Home!";
return;
}

const days = Math.floor(distance / (1000*60*60*24));
const hours = Math.floor((distance % (1000*60*60*24)) / (1000*60*60));
const minutes = Math.floor((distance % (1000*60*60)) / (1000*60));
const seconds = Math.floor((distance % (1000*60)) / 1000);

document.getElementById("countdown").innerHTML =
days + " Days<br>" +
hours + " Hours<br>" +
minutes + " Minutes<br>" +
seconds + " Seconds";
}

updateCountdown();
setInterval(updateCountdown,1000);

</script>

</body>
</html>
