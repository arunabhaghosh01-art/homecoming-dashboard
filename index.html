<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homecoming Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', sans-serif;
  }

  body {
    background-color: #080c14;
    background-image: 
      radial-gradient(at 0% 0%, rgba(0, 255, 136, 0.12) 0px, transparent 50%),
      radial-gradient(at 100% 100%, rgba(0, 153, 255, 0.12) 0px, transparent 50%);
    background-attachment: fixed;
    color: #f8fafc;
    min-height: 100vh;
    padding: 20px 16px;
    display: flex;
    justify-content: center;
  }

  .container {
    width: 100%;
    max-width: 500px;
  }

  /* Base Card Styles */
  .card {
    background: rgba(18, 24, 38, 0.65);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    opacity: 0;
    transform: translateY(20px);
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .card:hover, .card:active {
    border: 2px solid #00ff88;
    box-shadow: 0 20px 45px rgba(0, 255, 136, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    transform: translateY(-2px);
  }

  .card:nth-child(1) { animation-delay: 0.1s; }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.3s; }
  .card:nth-child(4) { animation-delay: 0.4s; }
  .card:nth-child(5) { animation-delay: 0.5s; }
  .card:nth-child(6) { animation-delay: 0.6s; }
  .card:nth-child(7) { animation-delay: 0.7s; }
  .card:nth-child(8) { animation-delay: 0.8s; }
  .card:nth-child(9) { animation-delay: 0.9s; }

  @keyframes fadeInUp {
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .title {
    color: #00ff88;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .big {
    font-size: 28px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
  }

  .box {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-radius: 12px;
    padding: 10px 4px;
    text-align: center;
    transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
  }

  .box:hover, .box:active {
    transform: scale(1.06);
    background: rgba(255, 255, 255, 0.08);
    border: 2px solid #00b8ff;
    box-shadow: 0 8px 20px rgba(0, 184, 255, 0.3);
  }

  .num {
    font-size: 22px;
    font-weight: 800;
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    animation: pulseGlow 2s infinite alternate;
  }

  @keyframes pulseGlow {
    from { text-shadow: 0 0 6px rgba(0, 255, 136, 0.2); }
    to { text-shadow: 0 0 14px rgba(0, 255, 136, 0.6); }
  }

  .unit {
    font-size: 10px;
    color: #64748b;
    font-weight: 700;
    margin-top: 2px;
  }

  .progress {
    height: 10px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 10px;
    border: 1px solid rgba(255, 255, 255, 0.05);
  }

  .fill {
    height: 100%;
    background: linear-gradient(90deg, #00ff88 0%, #00b8ff 100%);
    width: 0%;
    transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
  }

  /* Interactive Journey Track */
  .journey-track {
    position: relative;
    height: 52px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 12px;
    margin-top: 14px;
    overflow: hidden;
    display: flex;
    align-items: center;
  }

  .rider {
    position: absolute;
    left: 0%;
    width: 44px;
    height: 44px;
    transition: left 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.6));
    display: flex;
    align-items: center;
    justify-content: center;
    /* Facing LEFT (Opposite direction) */
    transform: scaleX(1);
  }

  .rider svg {
    width: 100%;
    height: 100%;
  }

  label {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 12px 0;
    font-size: 14px;
    font-weight: 600;
    color: #e2e8f0;
    cursor: pointer;
    transition: color 0.2s ease;
  }

  label:hover {
    color: #ffffff;
  }

  input[type="checkbox"] {
    appearance: none;
    width: 22px;
    height: 22px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 6px;
    outline: none;
    background: rgba(0, 0, 0, 0.2);
    cursor: pointer;
    position: relative;
    transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  input[type="checkbox"]:checked {
    background-color: #00ff88;
    border-color: #00ff88;
    transform: scale(1.1);
    box-shadow: 0 0 14px rgba(0, 255, 136, 0.6);
  }

  input[type="checkbox"]:checked::after {
    content: '✓';
    position: absolute;
    color: #000;
    font-size: 14px;
    font-weight: 900;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
  }

  ul {
    list-style: none;
  }

  li {
    padding: 6px 0;
    font-size: 14px;
    color: #cbd5e1;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: transform 0.2s ease;
  }

  li:hover {
    transform: translateX(4px);
    color: #ffffff;
  }

  li::before {
    content: "•";
    color: #00b8ff;
    font-size: 18px;
  }

  #score {
    font-size: 26px;
    font-weight: 800;
    color: #00b8ff;
    text-shadow: 0 0 12px rgba(0, 184, 255, 0.3);
    transition: all 0.3s ease;
  }

  #quote {
    font-size: 14px;
    font-style: italic;
    color: #cbd5e1;
    line-height: 1.5;
  }

  .history-control {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }

  input[type="date"] {
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 14px;
    outline: none;
  }

  #history-output {
    font-size: 13px;
    color: #94a3b8;
    margin-top: 6px;
    line-height: 1.4;
  }

  .footer-credit {
    text-align: center;
    margin-top: 24px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
    color: #64748b;
    letter-spacing: 0.5px;
  }

  .footer-credit span {
    color: #00ff88;
    font-weight: 700;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
  }
</style>
</head>
<body>

<div class="container">
  <div class="card">
    <div class="title">HOMECOMING</div>
    <div class="big">09 OCT 2026</div>
    <div class="grid">
      <div class="box"><div class="num" id="d">0</div><div class="unit">DAYS</div></div>
      <div class="box"><div class="num" id="h">0</div><div class="unit">HRS</div></div>
      <div class="box"><div class="num" id="m">0</div><div class="unit">MIN</div></div>
      <div class="box"><div class="num" id="s">0</div><div class="unit">SEC</div></div>
    </div>
  </div>

  <div class="card">
    <div class="title">61 DAY PROGRESS</div>
    <div id="daytxt" style="font-weight: 700; font-size: 16px;"></div>
    <div class="progress"><div class="fill" id="fill"></div></div>
    
    <!-- Animated Track with Boy Riding Facing Left -->
    <div class="journey-track">
      <div class="rider" id="rider"></div>
    </div>
  </div>

  <div class="card">
    <div class="title">TODAY'S WORKOUT</div>
    <div id="workout"></div>
  </div>

  <div class="card">
    <div class="title">NUTRITION</div>
    <div id="nutrition">
      <label><input type="checkbox" class="task" data-id="0"> 2 Eggs</label>
      <label><input type="checkbox" class="task" data-id="1"> Banana</label>
      <label><input type="checkbox" class="task" data-id="2"> Lunch</label>
      <label><input type="checkbox" class="task" data-id="3"> Chana/Peanuts</label>
      <label><input type="checkbox" class="task" data-id="4"> Dinner</label>
      <label><input type="checkbox" class="task" data-id="5"> 3L Water</label>
    </div>
  </div>

  <div class="card">
    <div class="title">ACNE CARE</div>
    <label><input type="checkbox" class="task" data-id="6"> Face Wash AM</label>
    <label><input type="checkbox" class="task" data-id="7"> Sunscreen</label>
    <label><input type="checkbox" class="task" data-id="8"> Face Wash PM</label>
    <label><input type="checkbox" class="task" data-id="9"> Adapalene</label>
  </div>

  <div class="card">
    <div class="title">DISCIPLINE</div>
    <label><input type="checkbox" class="task" data-id="10"> Sleep Before 11 PM</label>
    <label><input type="checkbox" class="task" data-id="11"> No Junk Food</label>
    <label><input type="checkbox" class="task" data-id="12"> No Porn / Adult Content & Movies</label>
    <label><input type="checkbox" class="task" data-id="13"> No Masturbation / Retention Streak</label>
  </div>

  <div class="card">
    <div class="title">DAILY SCORE</div>
    <div id="score">0%</div>
  </div>

  <div class="card">
    <div class="title">MOTIVATION</div>
    <div id="quote"></div>
  </div>

  <div class="card">
    <div class="title">CHECK PREVIOUS DAYS</div>
    <div class="history-control">
      <input type="date" id="history-date">
      <div id="history-output">Select a date above to review past scores.</div>
    </div>
  </div>

  <div class="footer-credit">
    This project made by <span>Arunabha Ghosh</span>
  </div>
</div>

<script>
// SVG Vector Graphics facing LEFT (opposite direction) matching reference stick-figure design

// Cycle: Facing Left
const svgCycle = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Wheels -->
  <circle cx="16" cy="46" r="9" stroke="#00ff88" stroke-width="3" fill="none"/>
  <circle cx="48" cy="46" r="9" stroke="#00ff88" stroke-width="3" fill="none"/>
  <!-- Bike Frame -->
  <path d="M16 46L24 28H18" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  <path d="M48 46L36 34L24 46H48Z" stroke="#00ff88" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M36 34L32 26" stroke="#00ff88" stroke-width="2.5"/>
  <!-- Rider (Yellow Helmet/Pink Head, Blue Shirt) -->
  <circle cx="30" cy="14" r="5" fill="#facc15"/>
  <path d="M30 19L26 31" stroke="#00b8ff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M28 22L18 28" stroke="#00b8ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 31L20 40L28 46" stroke="#00b8ff" stroke-width="2.5" stroke-linecap="round"/>
</svg>`;

// Scooter: Facing Left matching stick-figure photo reference
const svgScooter = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Scooter Wheels -->
  <circle cx="16" cy="48" r="7" stroke="#00ff88" stroke-width="3" fill="none"/>
  <circle cx="48" cy="48" r="7" stroke="#00ff88" stroke-width="3" fill="none"/>
  <!-- Scooter Frame -->
  <path d="M48 48H28L22 32L18 20H24" stroke="#00ff88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M28 42H44" stroke="#00ff88" stroke-width="3"/>
  <!-- Rider Stick-Figure (Pink head/helmet, blue body, orange legs) -->
  <circle cx="36" cy="14" r="5" fill="#f472b6"/>
  <path d="M36 19L36 34" stroke="#00b8ff" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M36 24L20 22" stroke="#00b8ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M36 34L32 44H26" stroke="#f97316" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>`;

// Motorcycle: Facing Left with forward crouched stick figure rider
const svgMotorcycle = `<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bike Wheels -->
  <circle cx="14" cy="46" r="9" stroke="#00ff88" stroke-width="3.5" fill="none"/>
  <circle cx="50" cy="46" r="9" stroke="#00ff88" stroke-width="3.5" fill="none"/>
  <!-- Bike Body -->
  <path d="M50 46L38 34H26L14 46" stroke="#00ff88" stroke-width="3" stroke-linecap="round"/>
  <path d="M40 34L34 24H20L24 34Z" fill="#00ff88"/>
  <path d="M22 24L18 18H14" stroke="#00ff88" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Rider Crouched Facing Left -->
  <circle cx="34" cy="12" r="5" fill="#facc15"/>
  <path d="M34 17L26 26" stroke="#00b8ff" stroke-width="4" stroke-linecap="round"/>
  <path d="M31 20L16 20" stroke="#00b8ff" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M26 26L30 36L24 38" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
</svg>`;

const target = new Date("2026-10-09T00:00:00");
const start = new Date("2026-08-08T00:00:00");

function getTodayString() {
  return new Date().toISOString().slice(0, 10);
}

let currentTrackingDate = getTodayString();

function tick() {
  const now = new Date();
  let diff = target - now;
  if (diff < 0) diff = 0;

  let d = Math.floor(diff / 86400000);
  let h = Math.floor((diff % 86400000) / 3600000);
  let m = Math.floor((diff % 3600000) / 60000);
  let s = Math.floor((diff % 60000) / 1000);

  document.getElementById('d').textContent = d;
  document.getElementById('h').textContent = h;
  document.getElementById('m').textContent = m;
  document.getElementById('s').textContent = s;

  const activeToday = getTodayString();
  if (activeToday !== currentTrackingDate) {
    currentTrackingDate = activeToday;
    initDailyDashboard();
  }
}
setInterval(tick, 1000);
tick();

function updateProgress() {
  let day = Math.max(0, Math.floor((new Date() - start) / 86400000));
  document.getElementById('daytxt').textContent = `Day ${day} / 61`;
  setTimeout(() => {
    document.getElementById('fill').style.width = Math.min((day / 61) * 100, 100) + '%';
  }, 300);
}

function updateWorkout() {
  const workouts = [
    ["45 Min Walk", "Stretching"],
    ["Push-ups", "Incline Push-ups", "Diamond Push-ups", "Plank"],
    ["Squats", "Lunges", "Calf Raises", "Wall Sit"],
    ["Jogging", "Mountain Climbers", "Jumping Jacks"],
    ["Pike Push-ups", "Plank", "Side Plank", "Leg Raises"],
    ["Push-ups", "Squats", "Lunges", "Burpees", "Plank"],
    ["Walk/Jog", "Bicycle Crunches", "Leg Raises", "Mountain Climbers"]
  ];
  document.getElementById('workout').innerHTML = "<ul>" + workouts[new Date().getDay()].map(x => "<li>" + x + "</li>").join("") + "</ul>";
}

function updateQuote() {
  const quotes = [
    "“The pain of discipline is nothing compared to the pain of regret.”",
    "“Every impulse you overcome builds the warrior inside you.”",
    "“Control your mind, or your mind will control you.”",
    "“Small daily wins stacked consistently create an unstoppable man.”",
    "“Focus on who you want to become when you walk through that door.”",
    "“Silence the noise, master yourself, and let your results speak.”",
    "“61 days to transform your physique, mindset, and presence.”"
  ];
  document.getElementById("quote").textContent = quotes[new Date().getDate() % quotes.length];
}

function initDailyDashboard() {
  updateProgress();
  updateWorkout();
  updateQuote();

  const todayKey = "hc-" + currentTrackingDate;
  const saved = JSON.parse(localStorage.getItem(todayKey) || "{}");

  document.querySelectorAll(".task").forEach(c => {
    const taskId = c.getAttribute("data-id");
    c.checked = !!saved[taskId];

    c.onchange = () => {
      let obj = JSON.parse(localStorage.getItem(todayKey) || "{}");
      obj[taskId] = c.checked;
      localStorage.setItem(todayKey, JSON.stringify(obj));
      calcScore();
    };
  });
  calcScore();
}

function calcScore() {
  let all = [...document.querySelectorAll(".task")];
  let done = all.filter(x => x.checked).length;
  let pct = Math.round((done / all.length) * 100);
  document.getElementById("score").textContent = pct + "% (" + done + "/" + all.length + ")";

  const rider = document.getElementById("rider");
  let pos = Math.min((done / all.length) * 85, 85);
  rider.style.left = pos + "%";

  // Stick-figure riding Cycle, Scooter, or Motorcycle
  if (pct < 34) {
    rider.innerHTML = svgCycle;
  } else if (pct < 80) {
    rider.innerHTML = svgScooter;
  } else {
    rider.innerHTML = svgMotorcycle;
  }
}

// History Inspector
document.getElementById('history-date').addEventListener('change', (e) => {
  const selectedDate = e.target.value;
  if (!selectedDate) return;

  const key = "hc-" + selectedDate;
  const record = JSON.parse(localStorage.getItem(key));
  const output = document.getElementById('history-output');

  if (!record) {
    output.textContent = `No recorded data found for ${selectedDate}.`;
    return;
  }

  const allTasks = document.querySelectorAll(".task");
  let completedCount = 0;
  let details = [];

  allTasks.forEach(task => {
    const taskId = task.getAttribute("data-id");
    const label = task.parentElement.textContent.trim();
    if (record[taskId]) {
      completedCount++;
      details.push("✓ " + label);
    }
  });

  const pct = Math.round((completedCount / allTasks.length) * 100);
  output.innerHTML = `<strong>Score: ${pct}% (${completedCount}/${allTasks.length})</strong><br>` + details.join("<br>");
});

initDailyDashboard();
</script>
</body>
</html>
